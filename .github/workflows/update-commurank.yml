name: Update Commurank data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - ".github/workflows/update-commurank.yml"
  # GitHub scheduled jobs can be delayed or occasionally skipped.
  # Run four times per hour, away from the top of the hour, to keep
  # the ranking fresh even when an individual schedule event is dropped.
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: commurank-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Collect public popularity metadata
        working-directory: .
        run: python scripts/collect.py

      - name: Commit updated ranking data
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "commurank-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Update Commurank rankings"
          git push
