name: Commurank freshness watchdog

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/commurank-watchdog.yml"
  schedule:
    # Runs seven minutes after the primary collector slots.
    # If the latest dataset is older than 20 minutes, recover it.
    - cron: "11,26,41,56 * * * *"

permissions:
  contents: write

concurrency:
  group: commurank-data
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Check data freshness
        id: freshness
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/latest.json")
          stale = True
          age_minutes = None

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              collected_at = data.get("collected_at")
              collected = datetime.fromisoformat(collected_at)
              if collected.tzinfo is None:
                  collected = collected.replace(tzinfo=timezone.utc)
              age_minutes = (datetime.now(timezone.utc) - collected.astimezone(timezone.utc)).total_seconds() / 60
              stale = age_minutes > 20
          except Exception as exc:
              print(f"Freshness check failed: {exc}")
              stale = True

          print(f"Latest data age: {age_minutes if age_minutes is not None else 'unknown'} minutes")
          print(f"Recovery needed: {stale}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"stale={'true' if stale else 'false'}\n")
          PY

      - name: Set up Python
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        if: steps.freshness.outputs.stale == 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Recover stale Commurank data
        if: steps.freshness.outputs.stale == 'true'
        working-directory: .
        run: python scripts/collect.py

      - name: Rebuild ranking archive pages
        if: steps.freshness.outputs.stale == 'true'
        run: python scripts/build_seo.py

      - name: Notify Naver IndexNow
        if: steps.freshness.outputs.stale == 'true'
        run: python scripts/notify_indexnow.py

      - name: Commit recovered data
        if: steps.freshness.outputs.stale == 'true'
        run: |
          if git diff --quiet -- data ranking briefing/archive briefing/[0-9]* sitemap.xml feed.xml; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "commurank-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data ranking briefing/archive briefing/[0-9]* sitemap.xml feed.xml
          git commit -m "Recover stale Commurank rankings"
          git pull --rebase origin main
          git push
