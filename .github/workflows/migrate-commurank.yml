name: Migrate Commurank site

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/migrate-commurank.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current Commurank source
        run: |
          git clone --depth 1 https://github.com/trier442/trier442.github.io.git /tmp/source

      - name: Copy site and data to repository root
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            /tmp/source/commurank/ ./

      - name: Rewrite paths and production URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          text_exts = {".html", ".js", ".css", ".md", ".xml", ".json", ".webmanifest", ".py"}

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if ".git" in path.parts or ".github" in path.parts:
                  continue
              if path.suffix.lower() not in text_exts and path.name not in {"CNAME"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              updated = text
              updated = updated.replace("https://trier442.github.io/commurank/", "https://commurank.kr/")
              updated = updated.replace("https://trier442.github.io/commurank", "https://commurank.kr")
              updated = updated.replace("/commurank/", "/")
              updated = updated.replace('const REPO="trier442/trier442.github.io";', 'const REPO="trier442/commurank";')

              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          Path("CNAME").write_text("commurank.kr\n", encoding="utf-8")
          Path(".nojekyll").write_text("", encoding="utf-8")
          PY

      - name: Commit migrated site
        run: |
          git config user.name "commurank-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to migrate."
            exit 0
          fi
          git commit -m "Launch Commurank on dedicated repository"
          git push
